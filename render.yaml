services:
    - type: web
      name: Ferrum
      env: docker
      plan: free
      autoDeploy: true
      envVars:
          - key: APP_NAME
            value: 'Ferrum'
          - key: APP_ENV
            value: production
          - key: APP_KEY
            sync: false
          - key: APP_DEBUG
            value: false
          - key: APP_URL
            value: https://ferrum.onrender.com
          - key: DB_CONNECTION
            value: pgsql
          - key: DB_HOST
            fromDatabase:
                name: DB_Ferrum
                property: host
          - key: DB_PORT
            fromDatabase:
                name: DB_Ferrum
                property: port
          - key: DB_DATABASE
            fromDatabase:
                name: DB_Ferrum
                property: database
          - key: DB_USERNAME
            fromDatabase:
                name: DB_Ferrum
                property: user
          - key: DB_PASSWORD
            fromDatabase:
                name: DB_Ferrum
                property: password

databases:
    - name: DB_Ferrum
      plan: free
      databaseName: ferrum
      user: adminFerrum
